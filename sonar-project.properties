# ============================================================
#  SonarQube Project Configuration
#  Used when running: mvn verify sonar:sonar -Psonar
# ============================================================

sonar.projectKey=Jatinghataliya_SAGA-Design-Pattern
sonar.projectName=SAGA Design Pattern
sonar.projectVersion=1.0.0
sonar.organization=jatinghataliya

# Source encoding
sonar.sourceEncoding=UTF-8

# Multi-module: each module reports its own coverage
sonar.modules=saga-commons,order-service,payment-service,inventory-service,shipping-service,choreography-commons,choreography-service

# JaCoCo XML coverage report (per module)
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

# Exclude boilerplate from analysis
sonar.exclusions=\
  **/dto/**,\
  **/enums/**,\
  **/entity/**,\
  **/config/**,\
  **/*Application.java

# Exclude test code from duplication check
sonar.cpd.exclusions=**/*Test.java

# Languages
sonar.language=java
