server.port=8080
spring.application.name=order-service

# H2 In-Memory Database
spring.datasource.url=jdbc:h2:mem:orderdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Downstream service URLs (used by the orchestrator)
services.payment.url=http://localhost:8081
services.inventory.url=http://localhost:8082
services.shipping.url=http://localhost:8083

logging.level.com.saga=DEBUG
