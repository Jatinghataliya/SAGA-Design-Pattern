version: "3.9"

services:

  # ── Payment Service ─────────────────────────────────────
  payment-service:
    build:
      context: .
      dockerfile: payment-service/Dockerfile
    image: saga/payment-service:ci
    container_name: payment-service
    ports:
      - "8081:8081"
    environment:
      SPRING_APPLICATION_NAME: payment-service
      SERVER_PORT: 8081
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 90s

  # ── Inventory Service ────────────────────────────────────
  inventory-service:
    build:
      context: .
      dockerfile: inventory-service/Dockerfile
    image: saga/inventory-service:ci
    container_name: inventory-service
    ports:
      - "8082:8082"
    environment:
      SPRING_APPLICATION_NAME: inventory-service
      SERVER_PORT: 8082
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 90s

  # ── Shipping Service ─────────────────────────────────────
  shipping-service:
    build:
      context: .
      dockerfile: shipping-service/Dockerfile
    image: saga/shipping-service:ci
    container_name: shipping-service
    ports:
      - "8083:8083"
    environment:
      SPRING_APPLICATION_NAME: shipping-service
      SERVER_PORT: 8083
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8083/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 90s

  # ── Choreography Service — all 4 choreography "services" in one JVM ──
  choreography-service:
    build:
      context: .
      dockerfile: choreography-service/Dockerfile
    image: saga/choreography-service:ci
    container_name: choreography-service
    ports:
      - "8090:8090"
    environment:
      SPRING_APPLICATION_NAME: choreography-service
      SERVER_PORT: 8090
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8090/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 90s

  # ── SonarQube ────────────────────────────────────────────
  sonarqube:
    image: sonarqube:11-community
    container_name: sonarqube
    depends_on:
      sonar-db:
        condition: service_healthy
    ports:
      - "9000:9000"
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonar-db:5432/sonarqube
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonar
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9000/api/system/status | grep -q '\"status\":\"UP\"' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s

  # ── SonarQube Postgres DB ────────────────────────────────
  sonar-db:
    image: postgres:15-alpine
    container_name: sonar-db
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar
      POSTGRES_DB: sonarqube
    volumes:
      - sonar_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonar -d sonarqube"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Order Service (Orchestrator) — starts last ───────────
  order-service:
    build:
      context: .
      dockerfile: order-service/Dockerfile
    image: saga/order-service:ci
    container_name: order-service
    ports:
      - "8080:8080"
    environment:
      SPRING_APPLICATION_NAME: order-service
      SERVER_PORT: 8080
      # Override localhost URLs to use Docker service names
      SERVICES_PAYMENT_URL: http://payment-service:8081
      SERVICES_INVENTORY_URL: http://inventory-service:8082
      SERVICES_SHIPPING_URL: http://shipping-service:8083
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 90s
    depends_on:
      payment-service:
        condition: service_healthy
      inventory-service:
        condition: service_healthy
      shipping-service:
        condition: service_healthy

volumes:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
  sonar_db_data:
