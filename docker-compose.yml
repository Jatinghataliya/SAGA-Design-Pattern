version: "3.9"

services:

  # ── Payment Service ─────────────────────────────────────
  payment-service:
    build:
      context: .
      dockerfile: payment-service/Dockerfile
    container_name: payment-service
    ports:
      - "8081:8081"
    environment:
      SPRING_APPLICATION_NAME: payment-service
      SERVER_PORT: 8081
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── Inventory Service ────────────────────────────────────
  inventory-service:
    build:
      context: .
      dockerfile: inventory-service/Dockerfile
    container_name: inventory-service
    ports:
      - "8082:8082"
    environment:
      SPRING_APPLICATION_NAME: inventory-service
      SERVER_PORT: 8082
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── Shipping Service ─────────────────────────────────────
  shipping-service:
    build:
      context: .
      dockerfile: shipping-service/Dockerfile
    container_name: shipping-service
    ports:
      - "8083:8083"
    environment:
      SPRING_APPLICATION_NAME: shipping-service
      SERVER_PORT: 8083
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8083/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── Choreography Service — all 4 choreography "services" in one JVM ──
  choreography-service:
    build:
      context: .
      dockerfile: choreography-service/Dockerfile
    container_name: choreography-service
    ports:
      - "8090:8090"
    environment:
      SPRING_APPLICATION_NAME: choreography-service
      SERVER_PORT: 8090
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8090/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── Order Service (Orchestrator) — starts last ───────────
  order-service:
    build:
      context: .
      dockerfile: order-service/Dockerfile
    container_name: order-service
    ports:
      - "8080:8080"
    environment:
      SPRING_APPLICATION_NAME: order-service
      SERVER_PORT: 8080
      # Override localhost URLs to use Docker service names
      SERVICES_PAYMENT_URL: http://payment-service:8081
      SERVICES_INVENTORY_URL: http://inventory-service:8082
      SERVICES_SHIPPING_URL: http://shipping-service:8083
    depends_on:
      payment-service:
        condition: service_healthy
      inventory-service:
        condition: service_healthy
      shipping-service:
        condition: service_healthy
