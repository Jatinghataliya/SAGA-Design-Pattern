name: CI

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # ── Job 1: always runs — build + unit tests ──────────────────────────────
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build and run tests
        run: mvn --batch-mode verify

      - name: Upload JaCoCo coverage reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-coverage-reports
          path: |
            **/target/site/jacoco/
          retention-days: 7

  # ── Job 2: only runs when SONAR_TOKEN secret is configured ───────────────
  sonar:
    name: SonarQube Analysis
    runs-on: ubuntu-latest
    needs: build-and-test
    # GitHub does not allow secrets in if-expressions directly.
    # We pass the token as an env var and check it in a "gate" step instead.

    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
      - name: Check Sonar token is configured
        run: |
          if [ -z "${SONAR_TOKEN}" ]; then
            echo "::notice::SONAR_TOKEN secret is not set - skipping Sonar analysis."
            echo "SKIP_SONAR=true" >> "$GITHUB_ENV"
          fi

      - name: Checkout repository
        if: env.SKIP_SONAR != 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # SonarCloud scanner requires Java 21+ (as of SonarCloud 13.x)
      # Source code still targets Java 17 via maven.compiler.source in pom.xml
      - name: Set up JDK 21 (required by SonarCloud scanner)
        if: env.SKIP_SONAR != 'true'
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Maven packages
        if: env.SKIP_SONAR != 'true'
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          # v2 suffix busts old cache that had sonar-maven-plugin 3.10 cached
          key: ${{ runner.os }}-maven-v2-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-v2-

      - name: Analyze with SonarQube / SonarCloud
        if: env.SKIP_SONAR != 'true'
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY }}
          SONAR_ORGANIZATION: ${{ secrets.SONAR_ORGANIZATION }}
        run: |
          # Resolve host URL: prefer the secret, fall back to SonarCloud
          HOST="${SONAR_HOST_URL:-https://sonarcloud.io}"
          KEY="${SONAR_PROJECT_KEY:-Jatinghataliya_SAGA-Design-Pattern}"

          # Print Java version to confirm JDK 21 is active
          java -version

          mvn --batch-mode verify sonar:sonar \
            -Psonar \
            -Dsonar.projectKey="${KEY}" \
            -Dsonar.organization="${SONAR_ORGANIZATION}" \
            -Dsonar.host.url="${HOST}" \
            -Dsonar.token="${SONAR_TOKEN}" \
            -Dsonar.scanner.javaExePath="${JAVA_HOME}/bin/java"
