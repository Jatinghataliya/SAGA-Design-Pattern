name: CI

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # ── Job 1: Build & Unit Tests ─────────────────────────────────────────────
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build and run unit tests
        run: mvn --batch-mode verify

      - name: Upload JaCoCo coverage reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-coverage-reports
          path: '**/target/site/jacoco/'
          retention-days: 7

  # ── Job 2: SonarQube Analysis (JDK 21) ───────────────────────────────────
  sonar:
    name: SonarQube Analysis
    runs-on: ubuntu-latest
    needs: build-and-test

    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
      - name: Check Sonar token is configured
        run: |
          if [ -z "${SONAR_TOKEN}" ]; then
            echo "::notice::SONAR_TOKEN secret is not set - skipping Sonar analysis."
            echo "SKIP_SONAR=true" >> "$GITHUB_ENV"
          fi

      - name: Checkout repository
        if: env.SKIP_SONAR != 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # SonarCloud scanner requires Java 21+ (as of SonarCloud 13.x)
      - name: Set up JDK 21 (required by SonarCloud scanner)
        if: env.SKIP_SONAR != 'true'
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Maven packages
        if: env.SKIP_SONAR != 'true'
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-v2-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-v2-

      - name: Analyze with SonarQube / SonarCloud
        if: env.SKIP_SONAR != 'true'
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY }}
          SONAR_ORGANIZATION: ${{ secrets.SONAR_ORGANIZATION }}
        run: |
          HOST="${SONAR_HOST_URL:-https://sonarcloud.io}"
          KEY="${SONAR_PROJECT_KEY:-Jatinghataliya_SAGA-Design-Pattern}"
          java -version
          mvn --batch-mode verify sonar:sonar \
            -Psonar \
            -Dsonar.projectKey="${KEY}" \
            -Dsonar.organization="${SONAR_ORGANIZATION}" \
            -Dsonar.host.url="${HOST}" \
            -Dsonar.token="${SONAR_TOKEN}" \
            -Dsonar.scanner.javaExePath="${JAVA_HOME}/bin/java"

  # ── Job 3: Trivy Vulnerability Scan (parallel) ───────────────────────────
  trivy-scan:
    name: Trivy Vulnerability Scan
    runs-on: ubuntu-latest
    needs: build-and-test
    permissions:
      security-events: write   # required to upload SARIF to GitHub Security tab

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Scan the repo filesystem for CVEs in pom.xml dependencies
      # CRITICAL severity only — fails build; HIGH produces warnings only
      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: library

      # Also produce a full SARIF report (uploaded to GitHub Security tab)
      - name: Run Trivy SARIF report
        uses: aquasecurity/trivy-action@v0.36.0
        if: always()
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          vuln-type: library

      - name: Upload Trivy SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif
          category: trivy-dependency-scan

  # ── Job 4: Docker Build Validation (parallel) ────────────────────────────
  docker-build:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build order-service image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: order-service/Dockerfile
          push: false
          tags: saga/order-service:ci
          cache-from: type=gha,scope=order-service
          cache-to: type=gha,mode=max,scope=order-service

      - name: Build payment-service image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: payment-service/Dockerfile
          push: false
          tags: saga/payment-service:ci
          cache-from: type=gha,scope=payment-service
          cache-to: type=gha,mode=max,scope=payment-service

      - name: Build inventory-service image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: inventory-service/Dockerfile
          push: false
          tags: saga/inventory-service:ci
          cache-from: type=gha,scope=inventory-service
          cache-to: type=gha,mode=max,scope=inventory-service

      - name: Build shipping-service image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: shipping-service/Dockerfile
          push: false
          tags: saga/shipping-service:ci
          cache-from: type=gha,scope=shipping-service
          cache-to: type=gha,mode=max,scope=shipping-service

      - name: Build choreography-service image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: choreography-service/Dockerfile
          push: false
          tags: saga/choreography-service:ci
          cache-from: type=gha,scope=choreography-service
          cache-to: type=gha,mode=max,scope=choreography-service

  # ── Job 5: Integration Tests (needs docker-build) ────────────────────────
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: docker-build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Restore Docker layer cache so images don't rebuild from scratch
      - name: Restore Docker layer cache - order-service
        uses: docker/build-push-action@v6
        with:
          context: .
          file: order-service/Dockerfile
          push: false
          load: true
          tags: saga/order-service:ci
          cache-from: type=gha,scope=order-service

      - name: Restore Docker layer cache - payment-service
        uses: docker/build-push-action@v6
        with:
          context: .
          file: payment-service/Dockerfile
          push: false
          load: true
          tags: saga/payment-service:ci
          cache-from: type=gha,scope=payment-service

      - name: Restore Docker layer cache - inventory-service
        uses: docker/build-push-action@v6
        with:
          context: .
          file: inventory-service/Dockerfile
          push: false
          load: true
          tags: saga/inventory-service:ci
          cache-from: type=gha,scope=inventory-service

      - name: Restore Docker layer cache - shipping-service
        uses: docker/build-push-action@v6
        with:
          context: .
          file: shipping-service/Dockerfile
          push: false
          load: true
          tags: saga/shipping-service:ci
          cache-from: type=gha,scope=shipping-service

      - name: Restore Docker layer cache - choreography-service
        uses: docker/build-push-action@v6
        with:
          context: .
          file: choreography-service/Dockerfile
          push: false
          load: true
          tags: saga/choreography-service:ci
          cache-from: type=gha,scope=choreography-service

      - name: Start SAGA Orchestrator services
        run: |
          docker compose up -d \
            payment-service \
            inventory-service \
            shipping-service \
            order-service

      - name: Wait for Orchestrator services to be healthy
        run: |
          for svc in payment-service inventory-service shipping-service order-service; do
            echo "Waiting for $svc..."
            timeout 300 bash -c "
              until [ \"\$(docker inspect --format='{{.State.Health.Status}}' $svc 2>/dev/null)\" = 'healthy' ]; do
                sleep 5
              done
            "
            echo "$svc is healthy"
          done

      - name: Run Orchestrator integration tests
        run: bash .github/scripts/integration-test.sh

      - name: Start Choreography service
        run: docker compose up -d choreography-service

      - name: Wait for Choreography service to be healthy
        run: |
          timeout 300 bash -c "
            until [ \"\$(docker inspect --format='{{.State.Health.Status}}' choreography-service 2>/dev/null)\" = 'healthy' ]; do
              sleep 5
            done
          "
          echo "choreography-service is healthy"

      - name: Run Choreography integration tests
        run: bash .github/scripts/integration-test-choreography.sh

      - name: Dump container logs on failure
        if: failure()
        run: |
          for svc in payment-service inventory-service shipping-service order-service choreography-service; do
            echo "========== $svc logs =========="
            docker logs "$svc" --tail 60 2>&1 || true
          done

      - name: Stop all services
        if: always()
        run: docker compose down -v

  # ── Job 6: Publish to GHCR (Continuous Delivery — main branch only) ──────
  publish:
    name: Publish to GHCR
    runs-on: ubuntu-latest
    needs: integration-tests
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    permissions:
      contents: read
      packages: write   # required to push to GHCR

    env:
      REGISTRY: ghcr.io

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # GHCR requires lowercase owner — github.repository_owner may have uppercase
      - name: Set image tag and prefix
        run: |
          echo "SHA_TAG=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_PREFIX=ghcr.io/${OWNER}" >> "$GITHUB_ENV"

      - name: Publish order-service
        uses: docker/build-push-action@v6
        with:
          context: .
          file: order-service/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/saga-order-service:latest
            ${{ env.IMAGE_PREFIX }}/saga-order-service:${{ env.SHA_TAG }}
          cache-from: type=gha,scope=order-service
          cache-to: type=gha,mode=max,scope=order-service

      - name: Publish payment-service
        uses: docker/build-push-action@v6
        with:
          context: .
          file: payment-service/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/saga-payment-service:latest
            ${{ env.IMAGE_PREFIX }}/saga-payment-service:${{ env.SHA_TAG }}
          cache-from: type=gha,scope=payment-service
          cache-to: type=gha,mode=max,scope=payment-service

      - name: Publish inventory-service
        uses: docker/build-push-action@v6
        with:
          context: .
          file: inventory-service/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/saga-inventory-service:latest
            ${{ env.IMAGE_PREFIX }}/saga-inventory-service:${{ env.SHA_TAG }}
          cache-from: type=gha,scope=inventory-service
          cache-to: type=gha,mode=max,scope=inventory-service

      - name: Publish shipping-service
        uses: docker/build-push-action@v6
        with:
          context: .
          file: shipping-service/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/saga-shipping-service:latest
            ${{ env.IMAGE_PREFIX }}/saga-shipping-service:${{ env.SHA_TAG }}
          cache-from: type=gha,scope=shipping-service
          cache-to: type=gha,mode=max,scope=shipping-service

      - name: Publish choreography-service
        uses: docker/build-push-action@v6
        with:
          context: .
          file: choreography-service/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/saga-choreography-service:latest
            ${{ env.IMAGE_PREFIX }}/saga-choreography-service:${{ env.SHA_TAG }}
          cache-from: type=gha,scope=choreography-service
          cache-to: type=gha,mode=max,scope=choreography-service

      - name: Print published image tags
        run: |
          echo "Published images:"
          echo "  ${{ env.IMAGE_PREFIX }}/saga-order-service:${{ env.SHA_TAG }}"
          echo "  ${{ env.IMAGE_PREFIX }}/saga-payment-service:${{ env.SHA_TAG }}"
          echo "  ${{ env.IMAGE_PREFIX }}/saga-inventory-service:${{ env.SHA_TAG }}"
          echo "  ${{ env.IMAGE_PREFIX }}/saga-shipping-service:${{ env.SHA_TAG }}"
          echo "  ${{ env.IMAGE_PREFIX }}/saga-choreography-service:${{ env.SHA_TAG }}"

  # ── Job 7: GitHub Release (auto changelog — main branch only) ────────────
  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: publish
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    permissions:
      contents: write   # required to create a GitHub Release

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set release version
        run: |
          echo "SHA_TAG=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          echo "RELEASE_NAME=release-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_PREFIX=ghcr.io/${OWNER}" >> "$GITHUB_ENV"

      - name: Generate release notes from commits
        run: |
          # Get commits since last tag (or all if no tag exists)
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -n "$LAST_TAG" ]; then
            COMMITS=$(git log "$LAST_TAG"..HEAD --pretty=format:"- %s (%h)" --no-merges)
          else
            COMMITS=$(git log HEAD --pretty=format:"- %s (%h)" --no-merges | head -20)
          fi

          cat > release-notes.md << EOF
          ## SAGA Design Pattern - ${{ env.RELEASE_NAME }}

          ### Docker Images
          Pull the images for this release:
          \`\`\`bash
          docker pull ${{ env.IMAGE_PREFIX }}/saga-order-service:${{ env.SHA_TAG }}
          docker pull ${{ env.IMAGE_PREFIX }}/saga-payment-service:${{ env.SHA_TAG }}
          docker pull ${{ env.IMAGE_PREFIX }}/saga-inventory-service:${{ env.SHA_TAG }}
          docker pull ${{ env.IMAGE_PREFIX }}/saga-shipping-service:${{ env.SHA_TAG }}
          docker pull ${{ env.IMAGE_PREFIX }}/saga-choreography-service:${{ env.SHA_TAG }}
          \`\`\`

          ### Changes
          ${COMMITS}

          ### Pipeline
          - Build & Test: passed
          - SonarQube: passed
          - Trivy Vulnerability Scan: passed
          - Docker Build Validation: passed
          - Integration Tests: passed
          - Published to GHCR: passed
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_NAME }}
          name: ${{ env.RELEASE_NAME }}
          body_path: release-notes.md
          draft: false
          prerelease: false

  # ── Job 8: Deploy (Continuous Deployment — manual approval gate) ──────────
  deploy:
    name: Deploy to Environment
    runs-on: ubuntu-latest
    needs: publish
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    # This environment requires a manual approval in GitHub Settings
    # Go to: Settings -> Environments -> New environment -> "production"
    # Add a "Required reviewers" protection rule with your username
    environment:
      name: production
      url: http://localhost:8080/actuator/health

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set image tag
        run: |
          echo "SHA_TAG=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_PREFIX=ghcr.io/${OWNER}" >> "$GITHUB_ENV"

      # Update docker-compose to use the published GHCR images for this SHA
      - name: Create production docker-compose override
        run: |
          cat > docker-compose.prod.yml << EOF
          version: "3.9"
          services:
            order-service:
              image: ${{ env.IMAGE_PREFIX }}/saga-order-service:${{ env.SHA_TAG }}
            payment-service:
              image: ${{ env.IMAGE_PREFIX }}/saga-payment-service:${{ env.SHA_TAG }}
            inventory-service:
              image: ${{ env.IMAGE_PREFIX }}/saga-inventory-service:${{ env.SHA_TAG }}
            shipping-service:
              image: ${{ env.IMAGE_PREFIX }}/saga-shipping-service:${{ env.SHA_TAG }}
            choreography-service:
              image: ${{ env.IMAGE_PREFIX }}/saga-choreography-service:${{ env.SHA_TAG }}
          EOF

      # ── Option A: Deploy via SSH to a remote server ──────────────────────
      # Uncomment and set SERVER_HOST, SSH_PRIVATE_KEY secrets to use this
      # - name: Deploy to remote server via SSH
      #   uses: appleboy/ssh-action@v1.2.0
      #   with:
      #     host: ${{ secrets.SERVER_HOST }}
      #     username: ${{ secrets.SERVER_USER }}
      #     key: ${{ secrets.SSH_PRIVATE_KEY }}
      #     script: |
      #       cd /opt/saga-design-pattern
      #       docker compose -f docker-compose.yml -f docker-compose.prod.yml pull
      #       docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d \
      #         order-service payment-service inventory-service shipping-service choreography-service
      #       docker compose ps

      # ── Option B: Smoke test the GHCR images locally in CI ───────────────
      - name: Log in to GHCR to pull published images
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull and start services from GHCR
        run: |
          docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d \
            payment-service inventory-service shipping-service order-service

      - name: Wait for services to be healthy
        run: |
          for svc in payment-service inventory-service shipping-service order-service; do
            echo "Waiting for $svc..."
            timeout 300 bash -c "
              until [ \"\$(docker inspect --format='{{.State.Health.Status}}' $svc 2>/dev/null)\" = 'healthy' ]; do
                sleep 5
              done
            "
            echo "$svc is healthy"
          done

      - name: Smoke test — happy path order
        run: |
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST http://localhost:8080/orders \
            -H "Content-Type: application/json" \
            -d '{
              "idempotencyKey": "deploy-smoke-test-001",
              "customerId": "SMOKE-1",
              "productId": "PROD-001",
              "quantity": 1,
              "amount": 50.00,
              "shippingAddress": "Smoke Test Lane"
            }')
          STATUS=$(echo "$RESPONSE" | tail -n 1)
          BODY=$(echo "$RESPONSE" | head -n -1)
          if [ "$STATUS" = "201" ] && echo "$BODY" | grep -q "COMPLETED"; then
            echo "Smoke test PASSED — deployment is healthy"
          else
            echo "Smoke test FAILED — HTTP $STATUS: $BODY"
            exit 1
          fi

      - name: Stop services
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.prod.yml down -v
