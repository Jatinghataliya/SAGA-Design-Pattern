name: SonarQube Analysis

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

jobs:
  sonar:
    name: Build, Test & Analyze
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout with full history (needed for SonarQube blame) ──
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── 2. Set up Java 17 ──────────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ── 3. Cache Maven dependencies ────────────────────────────────
      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      # ── 4. Cache SonarQube scanner data ────────────────────────────
      - name: Cache SonarQube data
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      # ── 5. Build, run tests, generate JaCoCo coverage, push to Sonar
      - name: Build, Test & Analyze with SonarQube
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY }}
          SONAR_ORGANIZATION: ${{ secrets.SONAR_ORGANIZATION }}
        run: |
          mvn --batch-mode verify sonar:sonar \
            -Psonar \
            -Dsonar.projectKey=${SONAR_PROJECT_KEY:-saga-design-pattern} \
            -Dsonar.organization=${SONAR_ORGANIZATION} \
            -Dsonar.host.url=${SONAR_HOST_URL:-https://sonarcloud.io} \
            -Dsonar.token=$SONAR_TOKEN

      # ── 6. Upload JaCoCo coverage reports as build artifacts ───────
      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-coverage-reports
          path: |
            **/target/site/jacoco/
          retention-days: 7
